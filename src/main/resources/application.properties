spring.application.name=PS47274_ASM_Final
# Cấu hình Port server
server.port=8080

# Cấu hình kết nối MS SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ASM_Java5;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

# Cấu hình Thymeleaf (tắt cache để DevTools reload HTML ngay lập tức)
spring.thymeleaf.cache=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl