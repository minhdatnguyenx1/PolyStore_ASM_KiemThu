<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="dynamic(main)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyStore - Chuyên thời trang T-shirt, Jeans & Sneakers</title>
    <!-- Nhúng Bootstrap 5 qua CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Gọi thanh Header -->
    <div th:replace="~{layout/header :: nav}"></div>

    <!-- Nội dung chính (Thay đổi tùy theo trang) -->
    <div class="container mt-4" style="min-height: 75vh;">
        <div th:replace="${main}"></div>
    </div>

    <!-- Chân trang -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 PolyStore. Designed for FPT Polytechnic Assignment.</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
