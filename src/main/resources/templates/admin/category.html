<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Quản trị Loại hàng</title>
</head>
<body>
    <main>
        <h3 class="mb-4 fw-bold text-danger">QUẢN LÝ LOẠI HÀNG (ADMIN)</h3>
        
        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <form method="post" th:object="${item}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Mã loại hàng (ID)</label>
                            <input th:field="*{id}" class="form-control" required placeholder="Ví dụ: KB01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tên loại hàng</label>
                            <input th:field="*{name}" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <button type="submit" formaction="/admin/category/create" class="btn btn-success me-2">Thêm mới</button>
                        <button type="submit" formaction="/admin/category/update" class="btn btn-primary me-2">Cập nhật</button>
                        <a href="/admin/category/index" class="btn btn-secondary">Làm mới form</a>
                    </div>
                </form>
            </div>
        </div>

        <h5 class="fw-bold mb-3">DANH SÁCH LOẠI HÀNG</h5>
        <div class="table-responsive shadow-sm">
            <table class="table table-bordered table-hover align-middle text-center mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Mã Loại</th>
                        <th>Tên Loại Hàng</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody class="bg-white">
                    <tr th:each="c : ${items}">
                        <td class="fw-bold" th:text="${c.id}"></td>
                        <td class="text-start" th:text="${c.name}"></td>
                        <td>
                            <a th:href="@{|/admin/category/edit/${c.id}|}" class="btn btn-sm btn-outline-primary">Sửa</a>
                            <a th:href="@{|/admin/category/delete/${c.id}|}" class="btn btn-sm btn-outline-danger">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
