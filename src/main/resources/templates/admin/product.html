<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Quản trị Sản phẩm</title>
</head>
<body>
    <main>
        <h3 class="mb-4 fw-bold text-danger">QUẢN LÝ SẢN PHẨM (ADMIN)</h3>
        
        <!-- Form nhập liệu Thêm/Sửa -->
        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <form method="post" th:object="${item}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Mã sản phẩm (ID)</label>
                            <input th:field="*{id}" class="form-control" readonly placeholder="Tự động tăng">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tên sản phẩm</label>
                            <input th:field="*{name}" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Giá bán (VNĐ)</label>
                            <input type="number" th:field="*{price}" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Loại hàng</label>
                            <select th:field="*{category.id}" class="form-select">
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Tên file ảnh</label>
                            <input th:field="*{image}" class="form-control">
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <button type="submit" formaction="/admin/product/create" class="btn btn-success me-2">Thêm mới</button>
                        <button type="submit" formaction="/admin/product/update" class="btn btn-primary me-2">Cập nhật</button>
                        <a href="/admin/product/index" class="btn btn-secondary">Làm mới form</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng danh sách dữ liệu -->
        <h5 class="fw-bold mb-3">DANH SÁCH SẢN PHẨM</h5>
        <div class="table-responsive shadow-sm">
            <table class="table table-bordered table-hover align-middle text-center mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá (VNĐ)</th>
                        <th>Loại</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody class="bg-white">
                    <tr th:each="p : ${items}">
                        <td th:text="${p.id}"></td>
                        <td><img th:src="@{|/images/${p.image}|}" style="width: 50px; height: 50px; object-fit: cover;"></td>
                        <td class="text-start" th:text="${p.name}"></td>
                        <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td th:text="${p.category.name}"></td>
                        <td>
                            <a th:href="@{|/admin/product/edit/${p.id}|}" class="btn btn-sm btn-outline-primary">Sửa</a>
                            <a th:href="@{|/admin/product/delete/${p.id}|}" class="btn btn-sm btn-outline-danger">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
