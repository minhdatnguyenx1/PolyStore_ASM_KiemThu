<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Quản trị Tài khoản</title>
</head>
<body>
    <main>
        <h3 class="mb-4 fw-bold text-danger">QUẢN LÝ TÀI KHOẢN (ADMIN)</h3>
        
        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <form method="post" th:object="${item}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tên đăng nhập</label>
                            <input th:field="*{username}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Mật khẩu</label>
                            <input th:field="*{password}" type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Họ và tên</label>
                            <input th:field="*{fullname}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input th:field="*{email}" type="email" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Vai trò</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{admin}" value="true">
                                <label class="form-check-label">Quản trị viên (Admin)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{admin}" value="false">
                                <label class="form-check-label">Khách hàng</label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{activated}" value="true">
                                <label class="form-check-label">Đang hoạt động</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{activated}" value="false">
                                <label class="form-check-label">Khóa tài khoản</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <button type="submit" formaction="/admin/account/create" class="btn btn-success me-2">Thêm mới</button>
                        <button type="submit" formaction="/admin/account/update" class="btn btn-primary me-2">Cập nhật</button>
                        <a href="/admin/account/index" class="btn btn-secondary">Làm mới form</a>
                    </div>
                </form>
            </div>
        </div>

        <h5 class="fw-bold mb-3">DANH SÁCH TÀI KHOẢN</h5>
        <div class="table-responsive shadow-sm">
            <table class="table table-bordered table-hover align-middle text-center mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Username</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody class="bg-white">
                    <tr th:each="a : ${items}">
                        <td class="fw-bold" th:text="${a.username}"></td>
                        <td class="text-start" th:text="${a.fullname}"></td>
                        <td th:text="${a.email}"></td>
                        <td>
                            <span th:if="${a.admin}" class="badge bg-danger">Admin</span>
                            <span th:unless="${a.admin}" class="badge bg-secondary">Khách hàng</span>
                        </td>
                        <td>
                            <span th:if="${a.activated}" class="text-success fw-bold">Hoạt động</span>
                            <span th:unless="${a.activated}" class="text-danger fw-bold">Đã khóa</span>
                        </td>
                        <td>
                            <a th:href="@{|/admin/account/edit/${a.username}|}" class="btn btn-sm btn-outline-primary">Sửa</a>
                            <a th:href="@{|/admin/account/delete/${a.username}|}" class="btn btn-sm btn-outline-danger">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
