<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <main class="d-flex justify-content-center">
        <div class="card shadow-sm mt-4" style="width: 500px;">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">ĐĂNG KÝ TÀI KHOẢN</h4>
            </div>
            <div class="card-body p-4">
                <div th:if="${message}" class="alert alert-success text-center p-2" th:text="${message}"></div>

                <form action="/account/sign-up" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập (Username)</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Họ và tên</label>
                        <input type="text" name="fullname" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <!-- Ẩn các trường mặc định -->
                    <input type="hidden" name="photo" value="default.png">
                    <input type="hidden" name="activated" value="true">
                    <input type="hidden" name="admin" value="false">

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark">Đăng ký ngay</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/auth/login" class="text-decoration-none">Đã có tài khoản? Đăng nhập</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
