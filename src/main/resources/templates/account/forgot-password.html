<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>
    <main class="d-flex justify-content-center">
        <div class="card shadow-sm mt-4" style="width: 500px;">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">KHÔI PHỤC MẬT KHẨU</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center">Vui lòng nhập Username hoặc Email bạn đã đăng ký. Hệ thống sẽ gửi hướng dẫn khôi phục qua email của bạn.</p>
                <form action="#" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Username / Email</label>
                        <input type="text" name="usernameOrEmail" class="form-control" required placeholder="Nhập vào đây...">
                    </div>
                    <div class="d-grid gap-2">
                        <!-- Nút Submit tạm thời dùng cho giao diện -->
                        <button type="submit" class="btn btn-warning fw-bold" onclick="alert('Yêu cầu đã được gửi!'); return false;">Gửi yêu cầu khôi phục</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="/auth/login" class="text-decoration-none">Trở lại trang Đăng nhập</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
