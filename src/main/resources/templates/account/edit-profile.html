<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Cập nhật hồ sơ</title>
</head>
<body>
    <main class="d-flex justify-content-center">
        <div class="card shadow-sm mt-4" style="width: 500px;">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">CẬP NHẬT HỒ SƠ</h4>
            </div>
            <div class="card-body p-4">
                <!-- Báo lỗi hoặc thành công -->
                <div th:if="${message}" class="alert alert-success text-center p-2" th:text="${message}"></div>

                <form action="/account/edit-profile" method="post" th:object="${item}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập (Username)</label>
                        <!-- Không cho phép sửa Username -->
                        <input type="text" th:field="*{username}" class="form-control bg-light" readonly>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Họ và tên</label>
                        <input type="text" th:field="*{fullname}" class="form-control" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>

                    <!-- Ẩn các trường giữ nguyên giá trị cũ để khi submit không bị mất dữ liệu -->
                    <input type="hidden" th:field="*{password}">
                    <input type="hidden" th:field="*{photo}">
                    <input type="hidden" th:field="*{activated}">
                    <input type="hidden" th:field="*{admin}">

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark">Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
