<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Đổi mật khẩu</title>
</head>
<body>
    <main class="d-flex justify-content-center">
        <div class="card shadow-sm mt-4" style="width: 500px;">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">ĐỔI MẬT KHẨU</h4>
            </div>
            <div class="card-body p-4">
                <form action="#" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mật khẩu hiện tại</label>
                        <input type="password" name="oldPassword" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mật khẩu mới</label>
                        <input type="password" name="newPassword" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Xác nhận mật khẩu mới</label>
                        <input type="password" name="confirmPassword" class="form-control" required>
                    </div>
                    <div class="d-grid gap-2">
                        <!-- Nút Submit tạm thời dùng cho giao diện -->
                        <button type="submit" class="btn btn-primary" onclick="alert('Đây là form Demo giao diện!'); return false;">Xác nhận đổi mật khẩu</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
