<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Đơn hàng của tôi</title>
</head>
<body>
    <main>
        <h3 class="mb-4 fw-bold text-center">LỊCH SỬ ĐƠN HÀNG</h3>
        
        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info text-center">
            Bạn chưa có đơn hàng nào. <a href="/home/index">Mua sắm ngay</a>.
        </div>

        <div th:if="${not #lists.isEmpty(orders)}" class="card shadow-sm border-0">
            <div class="card-body">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã đơn hàng</th>
                            <th>Ngày đặt</th>
                            <th>Địa chỉ giao hàng</th>
                            <th>Chi tiết</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="o : ${orders}">
                            <td class="fw-bold" th:text="'#' + ${o.id}"></td>
                            <td th:text="${#dates.format(o.createDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-start" th:text="${o.address}"></td>
                            <td>
                                <a th:href="@{|/order/detail/${o.id}|}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
