<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: dynamic(~{::main})}">
<head>
    <title>Giỏ hàng của bạn</title>
</head>
<body>
    <main>
        <h3 class="mb-4 fw-bold">GIỎ HÀNG CỦA BẠN</h3>
        
        <div th:if="${cart.count == 0}" class="alert alert-warning text-center">
            Giỏ hàng của bạn đang trống. <a href="/home/index" class="alert-link">Tiếp tục mua sắm</a>.
        </div>

        <div th:if="${cart.count > 0}">
            <table class="table table-bordered align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Mã SP</th>
                        <th>Tên sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td th:text="${item.id}"></td>
                        <td class="text-start" th:text="${item.name}"></td>
                        <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        
                        <!-- Form cập nhật số lượng -->
                        <td style="width: 150px;">
                            <form action="/cart/update" method="post" class="d-flex justify-content-center">
                                <input type="hidden" name="id" th:value="${item.id}">
                                <input type="number" name="qty" th:value="${item.qty}" min="1" class="form-control form-control-sm text-center me-2" style="width: 70px;">
                                <button type="submit" class="btn btn-sm btn-outline-primary">Cập nhật</button>
                            </form>
                        </td>
                        
                        <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.price * item.qty, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        <td>
                            <a th:href="@{|/cart/remove/${item.id}|}" class="btn btn-sm btn-danger">Xóa</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="d-flex justify-content-between align-items-center mt-3">
                <a href="/cart/clear" class="btn btn-outline-secondary">Xóa sạch giỏ hàng</a>
                <h4 class="text-danger fw-bold mb-0">
                    Tổng tiền: <span th:text="${#numbers.formatDecimal(cart.amount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                </h4>
            </div>
            
            <div class="text-end mt-4">
                <a href="/order/checkout" class="btn btn-success btn-lg px-5">Tiến hành Đặt hàng</a>
            </div>
        </div>
    </main>
</body>
</html>
